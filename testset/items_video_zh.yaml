# Chinese short-video ads (split: video). Written 2026-11-17, before any model saw them. Brands are fictional.
# Each video: 4 shots x 2 s, a subtitle per shot (lines), a post caption, optionally a 0.5 s sticker (flash).
# Answers are fixed here. Policy basis: PRC Advertising Law (2021) and the SAMR guide on absolute terms,
# same categories and clauses as grounded-review (policies/clauses.yaml there).
# where: caption | screen (shot index 1-4; shot 1 is the cover) | flash (0.5 s sticker) | visual (no words)
# art per shot: product (default) | drink_baijiu | drink_beer | drink_wine | drink_tea | drink_water | drink_juice | flag | lanterns
